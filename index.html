<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Project</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Page-turn slide animations -->
<style>
    @keyframes pageSlideFromRight {
        from { transform: translateX(60px); opacity: 0; }
        to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes pageSlideFromLeft {
        from { transform: translateX(-60px); opacity: 0; }
        to   { transform: translateX(0);     opacity: 1; }
    }
</style>
</head>
<body class="bg-blue-950 text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="relative w-full max-w-[500px] h-[calc(100dvh-2rem)] bg-neutral-900 rounded-2xl border border-red-500/30 shadow-2xl overflow-hidden flex flex-col p-5 gap-4">

        <!-- BOX 1: Header -->
        <header class="w-full bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-600 rounded-xl p-5 text-center shadow-lg shrink-0">
            <h1 class="text-xl font-extrabold tracking-wide text-white uppercase drop-shadow-md">
                Namobuddhayana🙏🙏🙏
            </h1>
        </header>

        <!-- BOX 2 & 3: Action Buttons -->
        <div class="grid grid-cols-2 gap-3 shrink-0">
            <button id="add-donation-btn" class="flex flex-col items-center justify-center p-5 bg-sky-500/10 hover:bg-sky-500/20 active:scale-95 border border-sky-500/30 rounded-xl transition gap-2 group">
                <svg class="w-7 h-7 text-sky-400 group-hover:scale-110 transition" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
                </svg>
                <span class="text-sm font-bold text-sky-300 tracking-wider">Add Donation</span>
            </button>

            <!-- id="expense-btn" is NEW — this is how expensePopup.js finds this button -->
            <button id="expense-btn" class="flex flex-col items-center justify-center p-5 bg-rose-500/10 hover:bg-rose-500/20 active:scale-95 border border-rose-500/30 rounded-xl transition gap-2 group">
                <svg class="w-7 h-7 text-rose-400 group-hover:scale-110 transition" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15"></path>
                </svg>
                <span class="text-sm font-bold text-rose-300 tracking-wider">Expense Feature</span>
            </button>
        </div>

        <!-- Scrollable middle: Donation list + Expense list stacked -->
        <div class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-4">

            <!-- BOX 4: Donation List (sky blue style) -->
            <section id="donation-section" class="flex flex-col gap-3 bg-neutral-950 border border-white/10 rounded-xl p-4">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-sky-400"></div>
                    <h2 class="text-xs font-bold uppercase tracking-widest text-sky-400">Donations</h2>
                </div>
                <div class="grid grid-cols-12 gap-2 px-2 text-xs font-bold uppercase tracking-wider text-gray-500">
                    <span class="col-span-1 text-center">No.</span>
                    <span class="col-span-4">Name</span>
                    <span class="col-span-3">Amount</span>
                    <span class="col-span-4">Date</span>
                </div>
                <div id="donation-list" class="flex flex-col gap-2"></div>
                <p id="list-info" class="text-center text-xs text-gray-500"></p>
            </section>

            <!-- BOX 5: Expense List (rose red style) -->
            <section id="expense-section" class="flex flex-col gap-3 bg-rose-950/20 border border-rose-500/20 rounded-xl p-4">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-rose-400"></div>
                    <h2 class="text-xs font-bold uppercase tracking-widest text-rose-400">Expenses</h2>
                </div>
                <div class="grid grid-cols-12 gap-2 px-2 text-xs font-bold uppercase tracking-wider text-gray-500">
                    <span class="col-span-1 text-center">No.</span>
                    <span class="col-span-4">Reason</span>
                    <span class="col-span-3">Amount</span>
                    <span class="col-span-4">Date</span>
                </div>
                <div id="expense-list" class="flex flex-col gap-2"></div>
                <p id="expense-list-info" class="text-center text-xs text-gray-500"></p>
            </section>

        </div>

        <!-- Footer -->
        <footer class="w-full bg-neutral-950 border border-white/10 rounded-xl p-3 flex items-center gap-2 shadow-inner min-h-[72px] shrink-0">
            <button id="profile-btn" class="w-10 h-10 rounded-lg bg-neutral-900 border border-white/10 hover:border-sky-500/40 active:scale-90 flex items-center justify-center transition group shrink-0">
                <svg class="w-6 h-6 text-sky-400 group-hover:rotate-[360deg] transition duration-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0-3.741-1.168 11.162 11.162 0 0 1-6.518 0 9.093 9.093 0 0 0-3.741 1.168M12 11.25a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z"></path>
                </svg>
            </button>
            <div class="flex-1 overflow-hidden rounded-lg bg-neutral-900/40">
                <img src="Donation-logo1.jpg" alt="Donation Logo" class="w-full h-auto block">
            </div>
            <button class="w-10 h-10 rounded-lg bg-neutral-900 border border-white/10 hover:border-sky-500/40 active:scale-90 flex items-center justify-center transition group shrink-0">
                <svg class="w-5 h-5 text-gray-400 group-hover:text-sky-400 group-hover:rotate-45 transition duration-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.767a1.123 1.123 0 0 0-.417 1.03c.004.074.006.148.006.222 0 .074-.002.148-.006.222a1.123 1.123 0 0 0 .417 1.03l1.003.767a1.125 1.125 0 0 1 .26 1.43l-1.296 2.247a1.125 1.125 0 0 1-1.37.49l-1.216-.456a1.125 1.125 0 0 0-1.076.124a6.57 6.57 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281a1.125 1.125 0 0 0-.646-.87a6.57 6.57 0 0 1-.22-.127a1.126 1.126 0 0 0-1.075-.124l-1.217.456a1.125 1.125 0 0 1-1.37-.49l-1.296-2.247a1.125 1.125 0 0 1 .26-1.43l1.003-.767a1.122 1.122 0 0 0 .417-1.03a6.586 6.586 0 0 1-.006-.222c0-.074.002-.148.006-.222a1.122 1.122 0 0 0-.417-1.03l-1.003-.767a1.125 1.125 0 0 1-.26-1.43l1.296-2.247a1.125 1.125 0 0 1 1.37-.49l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.645-.869L9.594 3.94ZM12 15.75a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z"></path>
                </svg>
            </button>
        </footer>

        <!-- DONATION POP-UP (unchanged) -->
        <div id="donation-popup" class="hidden absolute inset-0 z-50 items-center justify-center bg-black/70 backdrop-blur-sm p-5">
            <div class="w-full bg-neutral-900 border border-white/10 rounded-2xl p-5 shadow-2xl flex flex-col gap-4">
                <h2 class="text-lg font-extrabold text-sky-300 text-center tracking-wide">Add Donation</h2>
                <div class="flex flex-col gap-1">
                    <label for="popup-number" class="text-xs font-bold uppercase tracking-wider text-gray-500">No.</label>
                    <input id="popup-number" type="text" readonly placeholder="No." class="w-full px-4 py-3 text-base bg-neutral-950 border border-white/10 rounded-xl text-gray-400 outline-none">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="popup-name" class="text-xs font-bold uppercase tracking-wider text-gray-500">Name</label>
                    <input id="popup-name" type="text" placeholder="Type Name" class="w-full px-4 py-3 text-base bg-neutral-950 border border-white/10 focus:border-sky-500/60 rounded-xl text-white placeholder-gray-600 outline-none">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="popup-amount" class="text-xs font-bold uppercase tracking-wider text-gray-500">Amount</label>
                    <input id="popup-amount" type="number" inputmode="numeric" placeholder="Amount" class="w-full px-4 py-3 text-base bg-neutral-950 border border-white/10 focus:border-sky-500/60 rounded-xl text-white placeholder-gray-600 outline-none">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="popup-date" class="text-xs font-bold uppercase tracking-wider text-gray-500">Date</label>
                    <input id="popup-date" type="date" class="w-full px-4 py-3 text-base bg-neutral-950 border border-white/10 focus:border-sky-500/60 rounded-xl text-white outline-none scheme-dark">
                </div>
                <p id="popup-error" class="hidden text-sm font-semibold text-rose-400 text-center">Please fill Name, Amount and Date.</p>
                <div class="grid grid-cols-2 gap-3">
                    <button id="popup-cancel-btn" class="py-3.5 text-base font-bold text-gray-300 bg-neutral-800 hover:bg-neutral-700 active:scale-95 border border-white/10 rounded-xl transition">Cancel</button>
                    <button id="popup-done-btn" class="py-3.5 text-base font-bold text-white bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 active:scale-95 rounded-xl shadow-lg transition">Done</button>
                </div>
            </div>
        </div>

        <!-- EXPENSE POP-UP (NEW — rose/red style) -->
        <div id="expense-popup" class="hidden absolute inset-0 z-50 items-center justify-center bg-black/70 backdrop-blur-sm p-5">
            <div class="w-full bg-neutral-900 border border-rose-500/20 rounded-2xl p-5 shadow-2xl flex flex-col gap-4">
                <h2 class="text-lg font-extrabold text-rose-300 text-center tracking-wide">Add Expense</h2>
                <div class="flex flex-col gap-1">
                    <label for="popup-expense-number" class="text-xs font-bold uppercase tracking-wider text-gray-500">No.</label>
                    <input id="popup-expense-number" type="text" readonly placeholder="No." class="w-full px-4 py-3 text-base bg-neutral-950 border border-white/10 rounded-xl text-gray-400 outline-none">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="popup-expense-reason" class="text-xs font-bold uppercase tracking-wider text-gray-500">Reason</label>
                    <input id="popup-expense-reason" type="text" placeholder="Type Reason" class="w-full px-4 py-3 text-base bg-neutral-950 border border-white/10 focus:border-rose-500/60 rounded-xl text-white placeholder-gray-600 outline-none">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="popup-expense-amount" class="text-xs font-bold uppercase tracking-wider text-gray-500">Amount</label>
                    <input id="popup-expense-amount" type="number" inputmode="numeric" placeholder="Amount" class="w-full px-4 py-3 text-base bg-neutral-950 border border-white/10 focus:border-rose-500/60 rounded-xl text-white placeholder-gray-600 outline-none">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="popup-expense-date" class="text-xs font-bold uppercase tracking-wider text-gray-500">Date</label>
                    <input id="popup-expense-date" type="date" class="w-full px-4 py-3 text-base bg-neutral-950 border border-white/10 focus:border-rose-500/60 rounded-xl text-white outline-none scheme-dark">
                </div>
                <p id="popup-expense-error" class="hidden text-sm font-semibold text-rose-400 text-center">Please fill Reason, Amount and Date.</p>
                <div class="grid grid-cols-2 gap-3">
                    <button id="popup-expense-cancel-btn" class="py-3.5 text-base font-bold text-gray-300 bg-neutral-800 hover:bg-neutral-700 active:scale-95 border border-white/10 rounded-xl transition">Cancel</button>
                    <button id="popup-expense-done-btn" class="py-3.5 text-base font-bold text-white bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-400 hover:to-pink-400 active:scale-95 rounded-xl shadow-lg transition">Done</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
